<canvas id="c" width="100" height="100" style="background:#55f; transform: scale(4); transform-origin: top left;"></canvas>
<script>
  let ctx = document.getElementById('c').getContext('2d');
  ctx.translate(50, 50); // hand at 0,0
  
  let topY = -8; 
  let startX = -1; // Center on hand

  // Hand is at 0,0
  ctx.fillStyle = '#fca';
  ctx.fillRect(-2, -2, 4, 4);

  // Draw Stick (small)
  ctx.fillStyle = '#444';
  ctx.fillRect(startX, topY + 4, 2, 6);
  ctx.fillStyle = '#777';
  ctx.fillRect(startX, topY + 4, 1, 6); // left highlight
  
  // Draw Sphere
  ctx.fillStyle = '#777';
  ctx.fillRect(startX - 1, topY + 1, 4, 4); // base
  ctx.fillStyle = '#444';
  ctx.fillRect(startX - 1, topY + 4, 4, 1); // shadow
  ctx.fillRect(startX + 2, topY + 1, 1, 4); // right shadow
  ctx.fillStyle = '#fff';
  ctx.fillRect(startX, topY + 1, 2, 2); // highlight
  
  // Outlines
  ctx.fillStyle = '#000';
  ctx.fillRect(startX - 2, topY + 1, 1, 4); // left
  ctx.fillRect(startX + 3, topY + 1, 1, 4); // right
  ctx.fillRect(startX - 1, topY, 4, 1); // top
  ctx.fillRect(startX - 1, topY + 5, 1, 1); // bottom-left of sphere
  ctx.fillRect(startX + 2, topY + 5, 1, 1); // bottom-right of sphere
  ctx.fillRect(startX - 1, topY + 6, 1, 4); // stick left
  ctx.fillRect(startX + 2, topY + 6, 1, 4); // stick right
  
  // Hand over stick?
  ctx.fillStyle = '#fca';
  ctx.fillRect(-2, -2, 4, 4); // re-draw hand if needed
</script>
