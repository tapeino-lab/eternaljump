name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_LOOTLOCKER_API_KEY: ${{ secrets.VITE_LOOTLOCKER_API_KEY || 'dev_a30dce847162445799eac173326a4f9d' }}
          VITE_LOOTLOCKER_DOMAIN_KEY: ${{ secrets.VITE_LOOTLOCKER_DOMAIN_KEY || '83ib54ok' }}
          VITE_LOOTLOCKER_LEADERBOARD_ID: ${{ secrets.VITE_LOOTLOCKER_LEADERBOARD_ID || 'hct2' }}
          VITE_LOOTLOCKER_TA_LEADERBOARD_ID: ${{ secrets.VITE_LOOTLOCKER_TA_LEADERBOARD_ID || 'tatk' }}
          VITE_LOOTLOCKER_COIN_LEADERBOARD_ID: ${{ secrets.VITE_LOOTLOCKER_COIN_LEADERBOARD_ID || 'cointtl' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'zxcv0987' }}
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

