<!DOCTYPE html>
<html>
<style>
.box { width: 50px; height: 50px; background: red; margin: 50px; }
.b1 { transform: scaleX(0.5); filter: drop-shadow(10px 0 0 blue); }
.b2 { transform: scaleX(-0.5); filter: drop-shadow(10px 0 0 blue); }
</style>
<body>
<div class="box b1"></div>
<div class="box b2"></div>
</body>
</html>
